<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ethio Chess - ኢትዮ ቼስ</title>
  <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --eth-green: #009b48;
      --eth-yellow: #ffde00;
      --eth-red: #da121a;
      --bg-dark: #12181b;
      --panel-bg: #1e262c;
    }
    body { font-family: sans-serif; background-color: var(--bg-dark); color: #fff; margin: 0; padding: 15px; }
    .flag-bar { height: 6px; width: 100%; max-width: 950px; margin: 0 auto 15px; display: flex; border-radius: 3px; overflow: hidden; }
    .flag-bar .green { background: var(--eth-green); flex: 1; }
    .flag-bar .yellow { background: var(--eth-yellow); flex: 1; }
    .flag-bar .red { background: var(--eth-red); flex: 1; }
    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { margin: 0; font-size: 2.2rem; background: linear-gradient(45deg, var(--eth-green), var(--eth-yellow), var(--eth-red)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .container { max-width: 950px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
    #board { width: 100%; max-width: 450px; border: 3px solid #2d3748; border-radius: 6px; }
    .panel { background: var(--panel-bg); padding: 20px; border-radius: 12px; width: 100%; max-width: 320px; border-top: 4px solid var(--eth-yellow); display: flex; flex-direction: column; gap: 12px; }
    .timer-box { display: flex; justify-content: space-between; background: #0d1117; padding: 12px; border-radius: 8px; font-family: monospace; font-size: 1.1rem; }
    .timer-item span { color: var(--eth-yellow); font-weight: bold; }
    .btn-group { display: flex; flex-direction: column; gap: 10px; }
    button { background: var(--eth-green); color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    button.btn-tournament { background: linear-gradient(90deg, var(--eth-green), var(--eth-yellow), var(--eth-red)); color: #000; font-weight: 800; }
    #status { padding: 10px; background: #141b1f; border-left: 4px solid var(--eth-green); border-radius: 6px; font-size: 0.85rem; color: var(--eth-yellow); text-align: center; }
  </style>
</head>
<body>
  <div class="flag-bar"><div class="green"></div><div class="yellow"></div><div class="red"></div></div>
  <div class="header"><h1>ETHIO CHESS</h1><p>የኢትዮጵያውያን ኦንላይን እና ኦፍላይን የቼስ መጫወቻ</p></div>
  <div class="container">
    <div id="board"></div>
    <div class="panel">
      <div class="timer-box">
        <div class="timer-item">ነጭ: <span id="white-timer">05:00</span></div>
        <div class="timer-item">ጥቁር: <span id="black-timer">05:00</span></div>
      </div>
      <div id="status">Ethio Chess እንኳን ደህና መጡ!</div>
      <div class="btn-group">
        <button onclick="startBotGame()">ከሮቦት ጋር (vs AI)</button>
        <button onclick="startOfflineGame()">Pass & Play (Offline)</button>
        <button onclick="joinTournament()" class="btn-tournament">Ethio Tournament ተቀላቀል</button>
      </div>
    </div>
  </div>
  <script>
    let board = null;
    let game = new Chess();
    let socket = io();
    let timerInterval = null;
    let whiteTime = 300, blackTime = 300;
    let currentMode = 'offline';

    function onDragStart (source, piece) {
      if (game.game_over()) return false;
      if (piece.search(/^b/) !== -1 && currentMode === 'bot' && game.turn() === 'b') return false;
    }

    function makeRandomMove () {
      let possibleMoves = game.moves();
      if (possibleMoves.length === 0) return;
      let randomIdx = Math.floor(Math.random() * possibleMoves.length);
      game.move(possibleMoves[randomIdx]);
      board.position(game.fen());
    }

    function onDrop (source, target) {
      let move = game.move({ from: source, to: target, promotion: 'q' });
      if (move === null) return 'snapback';
      if (currentMode === 'bot') { window.setTimeout(makeRandomMove, 250); }
    }

    function onSnapEnd () { board.position(game.fen()); }

    function updateTimerDisplay() {
      document.getElementById('white-timer').innerText = formatTime(whiteTime);
      document.getElementById('black-timer').innerText = formatTime(blackTime);
    }

    function formatTime(sec) {
      let m = Math.floor(sec / 60), s = sec % 60;
      return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function startTimer() {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (game.turn() === 'w') { whiteTime--; } else { blackTime--; }
        updateTimerDisplay();
        if (whiteTime <= 0 || blackTime <= 0) clearInterval(timerInterval);
      }, 1000);
    }

    function startBotGame() {
      currentMode = 'bot'; game.reset(); board.start();
      whiteTime = 300; blackTime = 300; startTimer();
      document.getElementById('status').innerText = "Ethio Chess: ከሮቦት ጋር እየተጫወቱ ነው";
    }

    function startOfflineGame() {
      currentMode = 'offline'; game.reset(); board.start();
      whiteTime = 300; blackTime = 300; startTimer();
      document.getElementById('status').innerText = "Ethio Chess: Offline Mode";
    }
  
let config = {
    draggable: true,
    position: 'start',
    pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
    onDragStart: onDragStart,
    onDrop: onDrop,
    onSnapEnd: onSnapEnd
};


    
board = Chessboard('board', config);
