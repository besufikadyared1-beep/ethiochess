<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ethio Chess</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        #board {
            width: 340px;
            margin: 20px 0;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            background-color: #0088cc;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background-color: #006699;
        }
        #status {
            font-size: 1.1em;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Ethio Chess</h1>

    <div class="controls">
        <button onclick="setMode('pass')">📱 2 Players (Offline)</button>
        <button onclick="setMode('bot')">🤖 Vs Bot (Offline)</button>
        <button onclick="setMode('online')">🌐 Online Mode</button>
    </div>

    <div id="status">Mode: Select a game mode</div>
    <div id="board"></div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>

    <script>
        let board = null;
        let game = new Chess();
        let currentMode = 'pass';
        let socket = null;

        function onDragStart (source, piece, position, orientation) {
            if (game.game_over()) return false;
            if (currentMode === 'pass') return true;
            if (currentMode === 'bot' && game.turn() === 'b') return false;
        }

        function makeRandomMove () {
            let possibleMoves = game.moves();
            if (possibleMoves.length === 0) return;
            let randomIdx = Math.floor(Math.random() * possibleMoves.length);
            game.move(possibleMoves[randomIdx]);
            board.position(game.fen());
            updateStatus();
        }

        function onDrop (source, target) {
            let move = game.move({
                from: source,
                to: target,
                promotion: 'q'
            });

            if (move === null) return 'snapback';

            updateStatus();

            if (currentMode === 'bot' && !game.game_over()) {
                window.setTimeout(makeRandomMove, 250);
            }
        }

        function onSnapEnd () {
            board.position(game.fen());
        }

        function updateStatus () {
            let status = '';
            let moveColor = game.turn() === 'b' ? 'Black' : 'White';

            if (game.in_checkmate()) {
                status = 'Game over, ' + moveColor + ' is in checkmate.';
            } else if (game.in_draw()) {
                status = 'Game over, drawn position';
            } else {
                status = moveColor + ' to move';
                if (game.in_check()) {
                    status += ', ' + moveColor + ' is in check';
                }
            }
            $('#status').html('<b>Mode:</b> ' + currentMode.toUpperCase() + '<br>' + status);
        }

        function setMode(mode) {
            currentMode = mode;
            game.reset();
            board.position('start');
            updateStatus();

            if (mode === 'online') {
                if (!socket) socket = io();
                $('#status').html('Connecting to Online Server...');
            }
        }

        let config = {
            draggable: true,
            position: 'start',
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
            onDragStart: onDragStart,
            onDrop: onDrop,
            onSnapEnd: onSnapEnd
        };

        board = Chessboard('board', config);
        updateStatus();
    </script>
</body>
</html>
