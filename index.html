<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ethio Chess</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 15px;
        }
        #board {
            width: 340px;
            margin: 15px 0;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            background-color: #0088cc;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background-color: #006699;
        }
        .timer-box {
            display: flex;
            justify-content: space-between;
            width: 340px;
            margin-bottom: 10px;
        }
        .timer {
            font-size: 1.2em;
            font-weight: bold;
            background: #222;
            padding: 8px 15px;
            border-radius: 5px;
            border: 1px solid #444;
        }
        .active-timer {
            border-color: #0088cc;
            background: #004466;
        }
        #status {
            font-size: 1em;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Ethio Chess</h1>

    <div class="controls">
        <button onclick="setMode('pass')">📱 2 Players (Offline)</button>
        <button onclick="setMode('bot')">🤖 Vs Bot (Offline)</button>
        <button onclick="setMode('online')">🌐 Online Mode</button>
    </div>

    <div class="timer-box">
        <div id="blackTimer" class="timer">Black: 10:00</div>
        <div id="whiteTimer" class="timer active-timer">White: 10:00</div>
    </div>

    <div id="board"></div>
    <div id="status">Mode: PASS | White to move</div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>

    <script>
        let board = null;
        let game = new Chess();
        let currentMode = 'pass';
        let socket = null;
        let playerColor = 'w';

        let whiteTime = 600;
        let blackTime = 600;
        let timerInterval = null;

        function formatTime(seconds) {
            let mins = Math.floor(seconds / 60);
            let secs = seconds % 60;
            return (mins < 10 ? '0' : '') + mins + ':' + (secs < 10 ? '0' : '') + secs;
        }

        function updateTimerUI() {
            $('#whiteTimer').text('White: ' + formatTime(whiteTime));
            $('#blackTimer').text('Black: ' + formatTime(blackTime));

            if (game.turn() === 'w') {
                $('#whiteTimer').addClass('active-timer');
                $('#blackTimer').removeClass('active-timer');
            } else {
                $('#blackTimer').addClass('active-timer');
                $('#whiteTimer').removeClass('active-timer');
            }
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (game.game_over()) {
                    clearInterval(timerInterval);
                    return;
                }

                if (game.turn() === 'w') {
                    whiteTime--;
                    if (whiteTime <= 0) {
                        clearInterval(timerInterval);
                        alert('Time out! Black wins.');
                    }
                } else {
                    blackTime--;
                    if (blackTime <= 0) {
                        clearInterval(timerInterval);
                        alert('Time out! White wins.');
                    }
                }
                updateTimerUI();
            }, 1000);
        }

        function resetTimers() {
            clearInterval(timerInterval);
            timerInterval = null;
            whiteTime = 600;
            blackTime = 600;
            updateTimerUI();
        }

        function onDragStart (source, piece, position, orientation) {
            if (game.game_over()) return false;
            if (currentMode === 'pass') return true;
            if (currentMode === 'bot' && game.turn() === 'b') return false;
            if (currentMode === 'online' && game.turn() !== playerColor) return false;
        }

        function makeRandomMove () {
            let possibleMoves = game.moves();
            if (possibleMoves.length === 0) return;
            let randomIdx = Math.floor(Math.random() * possibleMoves.length);
            game.move(possibleMoves[randomIdx]);
            board.position(game.fen());
            updateStatus();
        }

        function onDrop (source, target) {
            let move = game.move({
                from: source,
                to: target,
                promotion: 'q'
            });

            if (move === null) return 'snapback';

            if (!timerInterval) {
                startTimer();
            }

            updateStatus();
            updateTimerUI();

            if (currentMode === 'online' && socket) {
                socket.emit('move', { from: source, to: target, promotion: 'q' });
            } else if (currentMode === 'bot' && !game.game_over()) {
                window.setTimeout(makeRandomMove, 250);
            }
        }

        function onSnapEnd () {
            board.position(game.fen());
        }

        function updateStatus () {
            let status = '';
            let moveColor = game.turn() === 'b' ? 'Black' : 'White';

            if (game.in_checkmate()) {
                status = 'Game over, ' + moveColor + ' is in checkmate.';
                clearInterval(timerInterval);
            } else if (game.in_draw()) {
                status = 'Game over, drawn position';
                clearInterval(timerInterval);
            } else {
                status = moveColor + ' to move';
                if (game.in_check()) {
                    status += ', ' + moveColor + ' is in check';
                }
            }
            $('#status').html('<b>Mode:</b> ' + currentMode.toUpperCase() + '<br>' + status);
        }

        function initSocket() {
            if (!socket) {
                socket = io();

                socket.on('playerRole', (role) => {
                    playerColor = role;
                    board.orientation(role === 'w' ? 'white' : 'black');
                    $('#status').html('<b>Online Mode:</b> You are playing as ' + (role === 'w' ? 'White' : 'Black'));
                });

                socket.on('move', (move) => {
                    game.move(move);
                    board.position(game.fen());
                    if (!timerInterval) startTimer();
                    updateStatus();
                    updateTimerUI();
                });

                socket.on('playerDisconnected', () => {
                    $('#status').html('<b>Opponent disconnected.</b>');
                    clearInterval(timerInterval);
                });
            }
        }

        function setMode(mode) {
            currentMode = mode;
            game.reset();
            board.position('start');
            board.orientation('white');
            resetTimers();
            updateStatus();

            if (mode === 'online') {
                initSocket();
                $('#status').html('Connecting to server...');
            }
        }

        let config = {
            draggable: true,
            position: 'start',
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
            onDragStart: onDragStart,
            onDrop: onDrop,
            onSnapEnd: onSnapEnd
        };

        board = Chessboard('board', config);
        updateStatus();
    </script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').then(reg => {
        console.log('Offline mode ready!');
      });
    });
  }
</script>
</body>
</html>
